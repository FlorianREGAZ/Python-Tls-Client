[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tls_client"
dynamic = ["version"]
description = "Advanced Python HTTP Client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Florian Zager" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Source = "https://github.com/FlorianREGAZ/Python-Tls-Client"

[tool.hatch.version]
path = "tls_client/__version__.py"

[tool.hatch.build.targets.sdist]
include = ["/tls_client", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
# Keep README examples laid out by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
# Long strings and comments are left alone; the formatter handles code.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["tls_client"]
