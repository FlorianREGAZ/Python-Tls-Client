name: Wheels

# Builds one wheel per platform, each holding only the upstream library for that platform,
# checks every wheel on a matching machine, and publishes to PyPI when a release is published.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel:
    name: Build wheel (${{ matrix.library }})
    # Nothing is compiled, so every wheel can be built on Linux; hatch_build.py picks the tag.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library:
          - tls-client-darwin-amd64.dylib
          - tls-client-darwin-arm64.dylib
          - tls-client-linux-386.so
          - tls-client-linux-arm64.so
          - tls-client-linux-armv7.so
          - tls-client-linux-ubuntu-amd64.so
          - tls-client-windows-32.dll
          - tls-client-windows-64.dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Download the native library
        run: uv run --no-project scripts/fetch_library.py ${{ matrix.library }}
      # --wheel builds from the source tree; the sdist doesn't contain the library.
      - run: uv build --wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.library }}
          path: dist/*.whl
          if-no-files-found: error

  smoke-test:
    name: Smoke test (${{ matrix.library }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - library: tls-client-darwin-amd64.dylib
            os: macos-26-intel
            python: "3.12"
          - library: tls-client-darwin-arm64.dylib
            os: macos-latest
            python: "3.12"
          - library: tls-client-linux-arm64.so
            os: ubuntu-24.04-arm
            python: "3.12"
          - library: tls-client-linux-ubuntu-amd64.so
            os: ubuntu-latest
            python: "3.12"
          - library: tls-client-windows-32.dll
            os: windows-latest
            python: cpython-3.12-windows-x86
          - library: tls-client-windows-64.dll
            os: windows-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.library }}
          path: dist
      # uv refuses a wheel whose tags don't match the interpreter, so this also checks the tag.
      - run: uv run --no-project --isolated --python ${{ matrix.python }} --with dist/*.whl python -I scripts/smoke_test.py ${{ matrix.library }}

  smoke-test-container:
    name: Smoke test (${{ matrix.library }})
    needs: wheel
    # GitHub has no 32-bit runners, so these run in a 32-bit container, under QEMU for armv7.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - library: tls-client-linux-386.so
            platform: linux/386
          - library: tls-client-linux-armv7.so
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform == 'linux/arm/v7'
        with:
          platforms: arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.library }}
          path: dist
      # pip refuses a wheel whose tags don't match the interpreter, so this also checks the tag.
      - run: >-
          docker run --rm --platform ${{ matrix.platform }} --volume "$PWD:/src" --workdir /src python:3.12-slim
          sh -c "pip install --quiet --root-user-action=ignore dist/*.whl && python -I scripts/smoke_test.py ${{ matrix.library }}"

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [sdist, smoke-test, smoke-test-container]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tls-client/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
