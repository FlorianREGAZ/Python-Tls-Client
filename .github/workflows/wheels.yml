name: Wheels

# Builds one wheel per platform, each holding only the upstream library for that platform,
# checks every wheel on a matching machine, and publishes to PyPI when a release is published.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel:
    name: Build wheel (${{ matrix.library }})
    # Nothing is compiled, so every wheel can be built on Linux; hatch_build.py picks the tag.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library:
          - tls-client-darwin-amd64.dylib
          - tls-client-darwin-arm64.dylib
          - tls-client-linux-alpine-amd64.so
          - tls-client-linux-arm64.so
          - tls-client-linux-ubuntu-amd64.so
          - tls-client-windows-32.dll
          - tls-client-windows-64.dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Download the native library
        run: uv run --no-project scripts/fetch_library.py ${{ matrix.library }}
      # --wheel builds from the source tree; the sdist doesn't contain the library.
      - run: uv build --wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.library }}
          path: dist/*.whl
          if-no-files-found: error

  smoke-test:
    name: Smoke test (${{ matrix.library }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - library: tls-client-darwin-amd64.dylib
            os: macos-26-intel
            python: "3.12"
          - library: tls-client-darwin-arm64.dylib
            os: macos-latest
            python: "3.12"
          - library: tls-client-linux-arm64.so
            os: ubuntu-24.04-arm
            python: "3.12"
          - library: tls-client-linux-ubuntu-amd64.so
            os: ubuntu-latest
            python: "3.12"
          - library: tls-client-windows-32.dll
            os: windows-latest
            python: cpython-3.12-windows-x86
          - library: tls-client-windows-64.dll
            os: windows-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.library }}
          path: dist
      # uv refuses a wheel whose tags don't match the interpreter, so this also checks the tag.
      - run: uv run --no-project --isolated --python ${{ matrix.python }} --with dist/*.whl python -I scripts/smoke_test.py ${{ matrix.library }}

  smoke-test-musl:
    name: Smoke test (tls-client-linux-alpine-amd64.so)
    needs: wheel
    # JavaScript actions can't run inside Alpine containers, so the test runs through docker directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-tls-client-linux-alpine-amd64.so
          path: dist
      - run: >
          docker run --rm -v "$PWD:/src:ro" -w /tmp python:3.12-alpine
          sh -c 'pip install --quiet --root-user-action=ignore /src/dist/*.whl
          && python -I /src/scripts/smoke_test.py tls-client-linux-alpine-amd64.so'

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [sdist, smoke-test, smoke-test-musl]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tls-client/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
